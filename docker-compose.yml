services:
  web:
    container_name: kiwi_web
    build:
      context: .
      dockerfile: Dockerfile
      target: kiwitcms
    restart: always
    network_mode: host
    volumes:
      - ./uploads:/Kiwi/uploads:Z
      - ./tcms:/venv/lib64/python3.12/site-packages/tcms:Z
    environment:
      KIWI_DB_ENGINE: django.db.backends.postgresql
      KIWI_DB_HOST: ${POSTGRES_HOST:-127.0.0.1}
      KIWI_DB_PORT: ${POSTGRES_PORT:-5432}
      KIWI_DB_NAME: ${POSTGRES_DB:-kiwi}
      KIWI_DB_USER: ${POSTGRES_USER:-postgres}
      KIWI_DB_PASSWORD: ${POSTGRES_PASSWORD:-12345678}
      KIWI_TENANTS_DOMAIN: ${KIWI_DOMAIN:-localhost}
    cap_drop:
      - ALL
